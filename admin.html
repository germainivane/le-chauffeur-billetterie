<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration – LE CHAUFFEUR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#18181b;--line:#3f3f46;--yellow:#facc15;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fafafa;font:15px Arial,sans-serif}header{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:0}main{max-width:1100px;margin:35px auto;padding:0 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px}input,button{font:inherit;border-radius:9px;padding:12px;border:1px solid var(--line)}input{display:block;width:100%;margin:8px 0 14px;background:#09090b;color:white}button{cursor:pointer;background:var(--yellow);color:#111;font-weight:bold;border:0}button.secondary{background:#27272a;color:white;border:1px solid var(--line)}button.danger{background:#7f1d1d;color:white}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.muted{color:#a1a1aa}.status{padding:8px 11px;border-radius:20px;font-size:12px;background:#713f12;color:#fde68a}.paid{background:#14532d;color:#bbf7d0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#facc15}.actions{display:flex;gap:8px;flex-wrap:wrap}.ticket{background:white;color:#111;padding:26px;border-radius:12px;max-width:700px;margin:20px auto;font-family:Arial}.ticket h2{margin:0 0 5px;font-size:28px}.ticket .gold{color:#9a6700;font-weight:bold}.ticketgrid{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:20px}.ticket small{color:#555}.ticketcode{font-size:20px;font-weight:bold;letter-spacing:1px}.error{color:#fca5a5}.success{color:#86efac}@media print{body{background:white}.no-print,header,main>.panel{display:none!important}#ticket-view{display:block!important;margin:0;padding:0}.ticket{max-width:none;border:2px solid #222;border-radius:0;margin:0;break-inside:avoid}}
</style></head>
<body>
<header><h1>🚌 LE CHAUFFEUR — ADMIN</h1><button id="logout" class="secondary hidden" onclick="logout()">Déconnexion</button></header>
<main>
<section id="login-panel" class="panel" style="max-width:460px;margin:50px auto"><h2>Connexion administrateur</h2><p class="muted">Accès réservé à l'organisateur.</p><form id="login-form"><label>Adresse e-mail</label><input id="email" type="email" autocomplete="username" required><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Se connecter</button></form><p id="login-message" class="muted" aria-live="polite"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>Réservations</h2><p class="muted">Vérifie d'abord le transfert dans ton compte Orange Money, MTN ou Wave. Ne valide jamais sur la seule base d'une capture d'écran.</p><button onclick="loadReservations()">Actualiser la liste</button><p id="dash-message" aria-live="polite"></p></div><div class="panel tablewrap"><table><thead><tr><th>Réservation</th><th>Client</th><th>Billet</th><th>Paiement</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="reservations-body"><tr><td colspan="6">Chargement…</td></tr></tbody></table></div></section>
<section id="ticket-view" class="hidden"><div class="no-print actions"><button class="secondary" onclick="backToList()">← Retour</button><button onclick="window.print()">Imprimer / Enregistrer en PDF</button></div><div id="ticket" class="ticket"></div></section>
</main>
<script>
const SUPABASE_URL='https://smuejzttycrqoosmolir.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_BWdlxRzaHiaTfJQS856nyw_Sc1TNcgE';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
function msg(id,text,cls=''){ $(id).textContent=text; $(id).className=cls; }
$('login-form').addEventListener('submit',async e=>{e.preventDefault();msg('login-message','Connexion…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('login-message','Connexion refusée. Vérifie ton e-mail et ton mot de passe.','error');return;}await checkAdmin();});
async function checkAdmin(){const {data:{user}}=await db.auth.getUser();if(!user){showLogin();return;}const {data,error}=await db.from('app_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await db.auth.signOut();showLogin();msg('login-message',error?'Erreur de sécurité/configuration SQL.':'Ce compte n’est pas autorisé comme administrateur.','error');return;} $('login-panel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');loadReservations();}
function showLogin(){$('login-panel').classList.remove('hidden');$('dashboard').classList.add('hidden');$('ticket-view').classList.add('hidden');$('logout').classList.add('hidden');}
async function logout(){await db.auth.signOut();showLogin();}
async function loadReservations(){msg('dash-message','Chargement des réservations…');const {data,error}=await db.from('reservations').select('id,reservation_code,customer_name,customer_phone,ticket_type,quantity,amount_fcfa,payment_method,transfer_reference,status,created_at').order('created_at',{ascending:false});if(error){msg('dash-message','Impossible de charger les réservations. Vérifie les politiques SQL.','error');return;}const body=$('reservations-body');body.innerHTML='';if(!data.length){body.innerHTML='<tr><td colspan="6">Aucune réservation pour le moment.</td></tr>';msg('dash-message','0 réservation');return;}msg('dash-message',data.length+' réservation(s)');for(const r of data){const tr=document.createElement('tr');const type=r.ticket_type==='vip'?'Clients Debouts VIP':'Jolis Clients';const status=r.status==='paid'?'Payé':r.status==='rejected'?'Refusé':r.status==='cancelled'?'Annulé':'En attente';tr.innerHTML=`<td><b>${esc(r.reservation_code)}</b><br><small>${new Date(r.created_at).toLocaleString('fr-FR')}</small></td><td>${esc(r.customer_name)}<br>${esc(r.customer_phone)}</td><td>${type}<br>${r.quantity} × ${Number(r.amount_fcfa/r.quantity).toLocaleString('fr-FR')} FCFA<br><b>${Number(r.amount_fcfa).toLocaleString('fr-FR')} FCFA</b></td><td>${esc(r.payment_method)}<br>Réf. : ${esc(r.transfer_reference||'Non fournie')}</td><td><span class="status ${r.status==='paid'?'paid':''}">${status}</span></td><td><div class="actions">${r.status==='pending'?`<button data-paid="${r.id}">Confirmer paiement</button><button class="danger" data-reject="${r.id}">Refuser</button>`:''}${r.status==='paid'?`<button data-ticket="${r.id}">Générer ticket</button>`:''}</div></td>`;body.appendChild(tr);}
body.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>setStatus(b.dataset.paid,'paid'));body.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>setStatus(b.dataset.reject,'rejected'));body.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>makeTicket(data.find(x=>x.id===b.dataset.ticket)));}
async function setStatus(id,status){const promptText=status==='paid'?'Confirmer que le transfert est bien reçu ?':'Refuser cette réservation ?';if(!confirm(promptText))return;const {error}=await db.from('reservations').update({status}).eq('id',id);if(error){alert('Modification refusée. Vérifie les droits administrateur et la configuration SQL.');return;}await loadReservations();}
function makeTicket(r){if(!r||r.status!=='paid'){alert('Le paiement doit être confirmé avant de générer le ticket.');return;} $('dashboard').classList.add('hidden');$('ticket-view').classList.remove('hidden');const label=r.ticket_type==='vip'?'CLIENTS DEBOUTS VIP':'JOLIS CLIENTS';$('ticket').innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><div class="gold">BILLET OFFICIEL • LE CHAUFFEUR</div><h2>LE CHAUFFEUR</h2><p>Spectacle d’humour — Abdoul Aziz Ossa</p></div><div style="font-size:42px">🎟️</div></div><hr><h3>${label}</h3><p><b>Nom :</b> ${esc(r.customer_name)}</p><p><b>Quantité :</b> ${r.quantity}</p><p><b>Montant payé :</b> ${Number(r.amount_fcfa).toLocaleString('fr-FR')} FCFA</p><div class="ticketgrid"><div><small>CODE DE RÉSERVATION / CONTRÔLE</small><div class="ticketcode">${esc(r.reservation_code)}</div><p class="gold">PAIEMENT VALIDÉ</p></div><div id="qr"></div></div><hr><small>Présentez ce billet à l’entrée. Chaque billet doit être contrôlé par l’organisateur. Conservez votre code unique.</small>`;new QRCode($('qr'),{text:r.reservation_code,width:116,height:116});}
function backToList(){$('ticket-view').classList.add('hidden');$('dashboard').classList.remove('hidden');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
db.auth.onAuthStateChange(()=>{});checkAdmin();
</script></body></html>
